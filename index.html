<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serie A Over/Under 2.5 Scanner</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans p-6">
    <div class="max-w-5xl mx-auto">
        <header class="mb-8 border-b border-slate-800 pb-4">
            <h1 class="text-3xl font-bold tracking-tight text-emerald-400">Serie A Market Scanner</h1>
            <p class="text-sm text-slate-400 mt-1">Analisi statistica basata sui dati reali del campionato.</p>
        </header>

        <main id="matches-container" class="grid gap-4 md:grid-cols-2">
            <p class="text-slate-500">Caricamento delle partite in corso...</p>
        </main>
    </div>

    <script>
        async function loadMatches() {
            try {
                const response = await fetch('data/matches_analysis.json');
                const matches = await response.json();
                const container = document.getElementById('matches-container');
                
                if(matches.length === 0) {
                    container.innerHTML = `<p class="text-slate-500">Nessuna partita analizzata al momento.</p>`;
                    return;
                }

                container.innerHTML = matches.map(m => `
                    <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg">
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-xs font-semibold px-2.5 py-1 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">${m.market_signal}</span>
                            <span class="text-xs text-slate-400">${m.date}</span>
                        </div>
                        <h2 class="text-xl font-bold mb-3">${m.match}</h2>
                        <div class="grid grid-cols-2 gap-2 text-sm bg-slate-900/50 p-3 rounded-lg mb-3">
                            <div>xG Combinati: <span class="font-bold text-white">${m.combined_xg}</span></div>
                            <div>Prob. Over 2.5: <span class="font-bold text-emerald-400">${(m.over_25_probability * 100).toFixed(0)}%</span></div>
                        </div>
                        <p class="text-xs text-slate-300 italic">"${m.motivation}"</p>
                    </div>
                `).join('');
            } catch (error) {
                console.error("Errore nel caricamento del file JSON:", error);
            }
        }
        loadMatches();
    </script>
</body>
</html>
